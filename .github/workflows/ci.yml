name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Check shell syntax
        run: |
          for script in run.sh scripts/*.sh tests/*.sh; do bash -n "$script"; done
      - name: Run ShellCheck
        run: shellcheck --severity=error run.sh scripts/*.sh tests/*.sh
      - name: Report ShellCheck warnings (baseline, non-blocking)
        run: shellcheck --severity=warning run.sh scripts/*.sh tests/*.sh || echo "::warning::ShellCheck warnings present; see log"
      - name: Run shell tests
        run: |
          for test in tests/*.sh; do bash "$test"; done
      - name: Run Python tests
        run: |
          python -B tests/test-archive-check.py
          python -B tests/test-storage.py
          python -B -m compileall -q scripts tests

  python-minimum:
    # Debian 11 ships Python 3.9 and Ubuntu 22.04 ships 3.10; keep both working.
    # Run in the official Python images: newer hosted runners no longer
    # provide 3.9 through setup-python.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10"]
    container: python:${{ matrix.python-version }}-slim
    steps:
      - name: Install test dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git openssh-client
      - uses: actions/checkout@v4
      - name: Run Python tests
        run: |
          python --version
          useradd --create-home tester
          chown -R tester "$GITHUB_WORKSPACE"
          su tester -c 'cd "$GITHUB_WORKSPACE" && python -B tests/test-archive-check.py && python -B tests/test-storage.py && python -B -m compileall -q scripts tests'

  distro:
    # Verify stat/find/tar/sqlite3/coreutils behaviour on supported releases.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:11", "debian:12", "ubuntu:22.04", "ubuntu:24.04"]
    container: ${{ matrix.image }}
    steps:
      - name: Install test dependencies
        run: |
          packages="bash ca-certificates coreutils findutils gawk git gzip python3 python-is-python3 sqlite3 tar util-linux openssh-client"
          use_debian_archive() {
            # End-of-life Debian releases move to archive.debian.org; the index
            # can still update while the security pool already returns 404.
            sed -i -e 's|deb.debian.org|archive.debian.org|g' -e 's|security.debian.org|archive.debian.org|g' -e '/-updates/d' /etc/apt/sources.list
            apt-get -o Acquire::Check-Valid-Until=false update
          }
          . /etc/os-release
          if [ "${VERSION_CODENAME:-}" = bullseye ]; then
            sed -i -e 's|http://deb.debian.org/debian-security|http://archive.debian.org/debian-security|g' -e 's|http://security.debian.org/debian-security|http://archive.debian.org/debian-security|g' /etc/apt/sources.list
          fi
          if ! apt-get -o Acquire::Check-Valid-Until=false update; then
            use_debian_archive
          fi
          if ! DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends $packages; then
            [ "${ID:-}" = debian ] || exit 1
            use_debian_archive
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends $packages
          fi
      - uses: actions/checkout@v4
      - name: Run shell tests
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          useradd --create-home tester
          chown -R tester "$GITHUB_WORKSPACE"
          su tester -c 'cd "$GITHUB_WORKSPACE" && for test in tests/*.sh; do echo "== $test"; bash "$test" || exit 1; done'
      - name: Run Python tests
        run: |
          su tester -c 'cd "$GITHUB_WORKSPACE" && python3 -B tests/test-archive-check.py && python3 -B tests/test-storage.py'
